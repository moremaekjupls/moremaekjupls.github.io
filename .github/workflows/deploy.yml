# Builds the Astro site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 10 minutes. GitHub Pages regularly takes longer to
          # acknowledge an artifact, and that timeout — not the build — is
          # what fails here: build finishes in ~20s, deploy gives up at 10m.
          timeout: 1800000          # 30 minutes
          error_count: 20
          reporting_interval: 10000
